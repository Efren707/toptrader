<div class="page">
  <app-navbar/>

  @if (notificationService.message(); as message) {
    <div class="notice-toast">
      <p>{{ message }}</p>
      <button
        type="button"
        class="notice-dismiss"
        aria-label="Dismiss"
        (click)="notificationService.clear()"
      >
        <svg
          viewBox="0 0 20 20"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <line x1="5" y1="5" x2="15" y2="15" />
          <line x1="15" y1="5" x2="5" y2="15" />
        </svg>
      </button>
    </div>
  }

  <main class="content">
    <router-outlet/>
  </main>
</div>
