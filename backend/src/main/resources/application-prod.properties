toptrader.frontend-origin=${TOPTRADER_FRONTEND_ORIGIN}
toptrader.csrf-cookie-domain=${TOPTRADER_CSRF_COOKIE_DOMAIN}
toptrader.mail-from-address=${TOPTRADER_MAIL_FROM_ADDRESS}
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jpa.show-sql=false
logging.structured.format.file=logstash
logging.file.name=/var/log/toptrader/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.logback.rollingpolicy.clean-history-on-start=true