name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-ci:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: toptrader
          POSTGRES_USER: toptrader
          POSTGRES_PASSWORD: toptrader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toptrader -d toptrader"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Lint (Spotless)
        run: ./mvnw -B spotless:check
      - name: Test
        run: ./mvnw -B test
      - name: Build
        run: ./mvnw -B package -DskipTests
      - name: Rename jar for deploy
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: cp target/backend-*.jar app.jar
      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/app.jar

  frontend-ci:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npx ng test --watch=false
      - name: Build
        run: npm run build
      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser

  deploy-frontend:
    needs: [changes, frontend-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.frontend-ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Sync to S3
        run: aws s3 sync dist s3://${{ secrets.FRONTEND_S3_BUCKET }} --delete
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  deploy-backend:
    needs: [changes, backend-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.backend-ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: .
      - run: mv app.jar app.jar.new
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ec2-18-226-207-9.us-east-2.compute.amazonaws.com
          port: 3333
          username: deploy
          key: ${{ secrets.EC2_DEPLOY_SSH_KEY }}
          source: app.jar.new
          target: /opt/toptrader
          overwrite: true
      - name: Restart and smoke test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ec2-18-226-207-9.us-east-2.compute.amazonaws.com
          port: 3333
          username: deploy
          key: ${{ secrets.EC2_DEPLOY_SSH_KEY }}
          script: |
            wait_healthy() {
              for i in $(seq 1 10); do
                if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                  echo "Healthy after ${i} attempt(s)"
                  return 0
                fi
                sleep 3
              done
              return 1
            }

            if [ -f /opt/toptrader/app.jar ]; then
              cp /opt/toptrader/app.jar /opt/toptrader/app.jar.bak
            fi
            mv /opt/toptrader/app.jar.new /opt/toptrader/app.jar
            sudo systemctl restart toptrader.service

            if wait_healthy; then
              echo "Deploy succeeded"
              exit 0
            fi

            echo "Service did not become healthy within 30s"

            if [ ! -f /opt/toptrader/app.jar.bak ]; then
              echo "No previous jar to roll back to (first deploy) - manual intervention required"
              exit 1
            fi

            echo "Rolling back to last-known-good jar"
            mv /opt/toptrader/app.jar.bak /opt/toptrader/app.jar
            sudo systemctl restart toptrader.service

            if wait_healthy; then
              echo "Rollback succeeded - service restored to last-known-good jar, but deploy is still marked as failed"
            else
              echo "Rollback also failed to become healthy - manual intervention required"
            fi
            exit 1
